[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imga-api"
version = "0.1.0"
description = "FastAPI HTTP wrapper around imga-core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "imga" }]
dependencies = [
    "imga-core",
    "imga-db",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "argon2-cffi>=23.1,<24.0",
    "pyjwt[crypto]>=2.8,<3.0",
    "email-validator>=2.1,<3.0",
    "python-multipart>=0.0.9",
    "cachetools>=5.3,<6.0",
    # Sprint 8.3.1 batch upload pipeline
    "apscheduler>=3.10,<4.0",
    "openpyxl>=3.1,<4.0",
    # Sprint 8.3.2 multi-sheet Excel reports
    "xlsxwriter>=3.2,<4.0",
    # Sprint 8.3.6 — SWOT/OKR generator stack:
    # - redis: SWOT cache (24h) + multi-key rotation state
    # - jinja2: prompt template rendering with conditionals/loops
    # - google-generativeai: structured-output SWOT/OKR calls. imga-core
    #   exposes it as the [gemini] extra; the api package depends
    #   directly so the runtime image always installs it.
    "redis>=5.0,<6.0",
    "jinja2>=3.1,<4.0",
    "google-generativeai>=0.8.0,<1.0",
    # Sprint 8.3.6.5 — WeasyPrint for SWOT/OKR PDF render. The runtime
    # image's Dockerfile installs the matching system libs (Pango,
    # Cairo, GdkPixbuf) + Türkçe-capable fonts; weasyprint itself
    # is the Python wheel.
    "weasyprint>=60.0,<70.0",
    # Sprint 8.3.10 + 9.0 D — httpx for outbound SLA webhook dispatch
    # (Slack / Teams) and the manual pending_webhook_events approval
    # path. Was inadvertently dev-only: 8.3.10 dispatcher usage was
    # all lazy-imported, so prod startup never resolved httpx and
    # the missing dep stayed hidden until Sprint 9.0 D added top-
    # level imports through pending_webhook_service +
    # tenant_pending_webhooks. Staging deploy of 23a6371 surfaced
    # the ModuleNotFoundError; this restores the contract.
    "httpx>=0.27",
    # Sprint 9.0.5-A — arq for the out-of-process batch worker. arq
    # uses Redis (we already have a managed Redis container) and is
    # async-native, so the worker function signature matches the
    # existing ``process_batch_job`` coroutine 1:1. Celery would mean
    # a broker swap + sync→async bridging.
    "arq>=0.26,<1.0",
    # Sprint 9.0.5-A — server-sent events for live batch progress.
    # sse-starlette wraps the EventSourceResponse contract +
    # auto-keepalive so the SSE endpoint doesn't have to hand-roll
    # the wire format.
    "sse-starlette>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "factory-boy>=3.3",
    "mypy>=1.10",
    "ruff>=0.5",
    # Sprint 8.3.6 — in-process Redis fake for SWOT cache tests; avoids
    # spinning up a real redis container for unit tests.
    "fakeredis>=2.23,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/imga_api"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
# Default per-test wall-clock cap. Sprint 8.3 batch tests opt into
# longer windows with @pytest.mark.timeout(N) (e.g. 1800s for the
# 10K-row batch). Anything that hits the default 60s ceiling is
# almost certainly a hung DB connection or runaway loop.
timeout = 60
timeout_method = "signal"
markers = [
    "slow: long-running tests (full BERT batch, 10K-row seed) — opt in with -m slow",
]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "uvicorn.*",
    "argon2.*",
    "asyncpg.*",
    "cachetools.*",
    "factory.*",
    "openpyxl.*",
    "apscheduler.*",
    "xlsxwriter.*",
    # Sprint 8.3.6 — types-redis ships with Optional Any leaks the strict
    # surface complains about; ignoring missing imports keeps the
    # cache module strict-clean without pulling extra dev deps.
    "redis.*",
    "fakeredis.*",
    "google.generativeai",
    "google.generativeai.*",
    # Sprint 8.3.6.5 — WeasyPrint ships untyped C extensions; types-
    # weasyprint isn't a thing. Keep the renderer module strict-clean
    # via ignore_missing_imports.
    "weasyprint",
    "weasyprint.*",
]
ignore_missing_imports = true

# factory_boy ships no type stubs and its descriptor-style API
# (factory.Factory, LazyFunction, Sequence, LazyAttribute) confuses
# mypy's strict mode at every reference. The factories module is
# fixture-only — keep strict elsewhere, relax here.
[[tool.mypy.overrides]]
module = ["tests.factories"]
disable_error_code = [
    "attr-defined",
    "name-defined",
    "no-untyped-call",
    "no-any-return",
    "misc",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
