[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imga-api"
version = "0.1.0"
description = "FastAPI HTTP wrapper around imga-core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "imga" }]
dependencies = [
    "imga-core",
    "imga-db",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "argon2-cffi>=23.1,<24.0",
    "pyjwt[crypto]>=2.8,<3.0",
    "email-validator>=2.1,<3.0",
    "python-multipart>=0.0.9",
    "cachetools>=5.3,<6.0",
    # Sprint 8.3.1 batch upload pipeline
    "apscheduler>=3.10,<4.0",
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "factory-boy>=3.3",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/imga_api"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
# Default per-test wall-clock cap. Sprint 8.3 batch tests opt into
# longer windows with @pytest.mark.timeout(N) (e.g. 1800s for the
# 10K-row batch). Anything that hits the default 60s ceiling is
# almost certainly a hung DB connection or runaway loop.
timeout = 60
timeout_method = "signal"
markers = [
    "slow: long-running tests (full BERT batch, 10K-row seed) — opt in with -m slow",
]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "uvicorn.*",
    "argon2.*",
    "asyncpg.*",
    "cachetools.*",
    "factory.*",
    "openpyxl.*",
    "apscheduler.*",
]
ignore_missing_imports = true

# factory_boy ships no type stubs and its descriptor-style API
# (factory.Factory, LazyFunction, Sequence, LazyAttribute) confuses
# mypy's strict mode at every reference. The factories module is
# fixture-only — keep strict elsewhere, relax here.
[[tool.mypy.overrides]]
module = ["tests.factories"]
disable_error_code = [
    "attr-defined",
    "name-defined",
    "no-untyped-call",
    "no-any-return",
    "misc",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
