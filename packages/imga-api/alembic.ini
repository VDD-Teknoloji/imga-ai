; Production / runtime alembic config — bu dosya Docker image içinde
; /app/alembic.ini olarak kopyalanır. Container'da `alembic upgrade head`
; çalıştırılır; alembic CWD'deki alembic.ini'yi bulur.
;
; Dev makinesinde KULLANILMAZ — packages/imga-db/alembic.ini path-relative
; çalışıyor (src/imga_db/alembic). Burası absolute path kullanır çünkü
; runtime image WORKDIR /app, ve imga_db site-packages'a kuruludur.
;
; Python 3.11 path'i Dockerfile'daki `ARG PYTHON_VERSION=3.11` ile pin'li.
; Python sürümünü yükseltmek istersen (3.12 vb.) hem Dockerfile'daki ARG
; hem buradaki path birlikte güncellenmeli.

[alembic]
; Migration scripts'in kurulu paket içindeki yeri.
script_location = /usr/local/lib/python3.11/site-packages/imga_db/alembic

; Migration dosyası adı pattern'i — dev ile aynı, geçmişle uyumlu.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

; sqlalchemy.url placeholder. env.py içinde
; `config.set_main_option("sqlalchemy.url", get_database_url("owner"))` ile
; runtime'da DATABASE_URL_OWNER env'inden override edilir; buradaki değer
; sadece alembic'in syntax check yapması için yer tutucu.
sqlalchemy.url = postgresql+asyncpg://overridden-by-env-py

timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
