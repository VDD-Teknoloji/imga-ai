[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imga-core"
version = "0.1.0"
description = "Core Turkish customer-review sentiment analysis pipeline (BERT + heuristic overrides)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "imga" }]
keywords = ["sentiment", "nlp", "turkish", "bert", "customer-experience"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "transformers>=4.40,<5.0",
    "torch>=2.0,<3.0",
    "pandas>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    # Sprint 8.3.6 — Fernet symmetric encryption for tenant LLM
    # credentials (imga_core.security.encryption).
    "cryptography>=42.0,<46.0",
]

[project.optional-dependencies]
gemini = ["google-generativeai>=0.8.0,<1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.10",
    "mypy>=1.10",
    "ruff>=0.5",
    "google-generativeai>=0.8.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/imga/imga-ai"

[tool.hatch.build.targets.wheel]
packages = ["src/imga_core"]

[tool.hatch.build.targets.sdist]
include = ["src/imga_core", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (require model download)",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src/imga_core"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["transformers.*", "torch.*", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length (handled by formatter)
    "RUF001", # ambiguous unicode characters (Turkish: ı vs i, etc.)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
