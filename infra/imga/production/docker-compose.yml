# İmga.AI — production stack
#
# Yer: /opt/imga/infra/imga/production/docker-compose.yml (sunucuda)
#
# Bu compose 3 container ayağa kaldırır:
#   * postgres    — kendi kalıcı volume'u, sadece imga-prod-internal'da
#   * api         — FastAPI, hem internal (DB için) hem caddy-public'te
#   * web         — Next.js, sadece caddy-public'te
#
# /opt/shared/caddy stack'i ayrı; bu compose Caddy'yi değiştirmez.
# Caddy reverse proxy config'i /opt/shared/caddy/conf.d/imga-production.conf
# üzerinden gelir (`infra/imga/caddy/imga-production.conf` şablonundan
# kopyalanır).
#
# Komut: cd /opt/imga/infra/imga/production && sudo docker compose up -d
# (sudo çünkü env dosyaları /etc/imga/production/ altında root-only.)

name: imga-production

services:
  postgres:
    image: postgres:17-alpine
    container_name: imga-prod-postgres
    restart: unless-stopped
    env_file: /etc/imga/production/postgres.env
    environment:
      POSTGRES_DB: imga
      POSTGRES_USER: imga_owner
    # Sprint 9.0 — Postgres tuning for the 10K-row batch demo workload.
    # The container memory limit jumps 1G -> 4G so the BERT inference
    # path on the api side isn't fighting the DB for page cache. Tuning
    # values follow the 25% / 75% rule (shared_buffers / effective_cache_size)
    # off the new 4G ceiling. pg_stat_statements is preloaded here so
    # migration 0022's CREATE EXTENSION succeeds on first run.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=200
      - -c
      - pg_stat_statements.max=5000
      - -c
      - pg_stat_statements.track=all
      - -c
      - random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # imga-db init script (3 rolü ilk başlatmada yaratır: owner / app / admin)
      - ../../../packages/imga-db/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - imga-prod-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imga_owner -d imga"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'

  api:
    image: imga-api:production
    build:
      context: ../../..
      dockerfile: packages/imga-api/Dockerfile
    container_name: imga-prod-api
    restart: unless-stopped
    env_file: /etc/imga/production/api.env
    # Sprint 8.3.6: Fernet master key + Redis URL injected via env, so the
    # encryption helper and the SWOT cache pick them up without leaking
    # the key into the env file. The secret is mounted read-only at
    # /run/secrets/imga/master.key (chmod 0400 by Docker).
    environment:
      IMGA_MASTER_KEY_PATH: /run/secrets/imga/master.key
      REDIS_URL: redis://redis:6379/0
    secrets:
      - source: imga_master_key
        target: imga/master.key
        mode: 0400
    networks:
      - imga-prod-internal
      - caddy-public
    # Sprint 8.3.1: batch upload payload'ları host'taki /var/imga/uploads'a
    # düşer (worker stream eder, 24h cleanup cron eskiyenleri siler).
    # Sprint 8.3.2: rapor çıktıları /var/imga/reports'a, aynı 24h cleanup.
    # Host dizinleri owner=1000:1000 (Dockerfile'daki imga user) olmalı.
    volumes:
      - /var/imga/uploads:/var/imga/uploads
      - /var/imga/reports:/var/imga/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 KASITLI — `localhost` Alpine resolver'ında ::1'i
      # önce dener, Next.js standalone (web servisi) IPv4-only listen
      # eder ve BusyBox wget IPv6 fallback yapmaz; tutarlılık için
      # API tarafında da 127.0.0.1 sabitlendi.
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '2'

  # Sprint 9.0.5-A — out-of-process batch worker (arq).
  #
  # Today's incident: a 2852-row CSV upload sat at processed_rows=0
  # for 21 min while the API container itself stopped serving
  # /reviews / /insights — the in-process APScheduler ran BERT
  # inference on the request handlers' event loop and the sync
  # transformers C extension never yielded. arq moves BERT work to a
  # separate process; even a wedged worker can't take the API down.
  #
  # Same image as the api service (worker reuses imga-core +
  # imga-db + the imga-api install). The CMD override switches it
  # from uvicorn to the arq worker entrypoint. Memory limit covers 4
  # parallel BERT pipelines (B3 chunk concurrency) + asyncpg pool +
  # Python overhead with margin.
  api-worker:
    image: imga-api:production
    build:
      context: ../../..
      dockerfile: packages/imga-api/Dockerfile
    container_name: imga-prod-api-worker
    restart: unless-stopped
    env_file: /etc/imga/production/api.env
    environment:
      IMGA_MASTER_KEY_PATH: /run/secrets/imga/master.key
      REDIS_URL: redis://redis:6379/0
      # Default 4 parallel chunks; bump only if you also bump the
      # memory limit below (each pipeline ≈ 350-400 MiB).
      IMGA_BATCH_CHUNK_CONCURRENCY: "4"
    secrets:
      - source: imga_master_key
        target: imga/master.key
        mode: 0400
    networks:
      - imga-prod-internal
    # Same upload + report mounts as the api so the worker can read
    # the CSV/XLSX the API wrote on POST /analyze/batch.
    volumes:
      - /var/imga/uploads:/var/imga/uploads
      - /var/imga/reports:/var/imga/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - python
      - -m
      - arq
      - imga_api.workers.arq_worker.WorkerSettings
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'

  web:
    image: imga-web:production
    build:
      context: ../../../packages/imga-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.imga.ai
    container_name: imga-prod-web
    restart: unless-stopped
    networks:
      - caddy-public
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 KASITLI — Next.js standalone HOSTNAME=0.0.0.0 ile
      # IPv4-only listen ediyor. Alpine'de `localhost` hem ::1 hem
      # 127.0.0.1'e çözülür; BusyBox wget IPv6'yı önce dener,
      # bağlantı reddedilir, IPv4'e fallback yapmaz → healthcheck
      # FAIL ama server gerçekte sağlıklı.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

  # Sprint 8.3.6 — SWOT generation cache (24h TTL per tenant + date range)
  # plus rate-limit / multi-key rotation state. allkeys-lru eviction so
  # an unbounded tenant set can't OOM the container.
  redis:
    image: redis:7-alpine
    container_name: imga-prod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - imga-prod-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'

networks:
  # Sadece bu projenin container'larının paylaştığı network. Postgres'i
  # dış dünyaya açmadan api'nin DB'ye ulaşmasına izin verir.
  imga-prod-internal:
    name: imga-prod-internal
  # Shared Caddy'nin gördüğü network — /opt/shared/caddy stack'i tarafından
  # önceden oluşturulmuş. api + web bu network'e join eder ki Caddy onlara
  # `imga-prod-api:8000` ve `imga-prod-web:3000` olarak ulaşabilsin.
  caddy-public:
    external: true

volumes:
  # Üretimden gelen veri — disk-only, tenant tickets / users / reviews
  # buradan okunur. Backup'taki tek doğruluk kaynağı.
  postgres_data:
    name: imga-prod-postgres-data
  # Sprint 8.3.6 — Redis AOF + RDB persistence için. SWOT cache
  # ephemeral olsa da Redis'i restart sonrası warm tutmak ilk request
  # latency'sini düşürür.
  redis_data:
    name: imga-prod-redis-data

# Sprint 8.3.6 — Fernet master key for tenant LLM credential encryption.
# Mounted into the api container at /run/secrets/imga/master.key (mode
# 0400). Source file lives at /etc/imga-secrets/master.key on the host
# (root:root, chmod 600 — see docs/sprints/sprint-8.3.6-master.md).
secrets:
  imga_master_key:
    file: /etc/imga-secrets/master.key
