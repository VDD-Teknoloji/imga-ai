# İmga.AI — server-side integration test stack
#
# Yer: /opt/imga/infra/imga/test/docker-compose.yml (sunucuda)
#
# Amaç: Sprint 8.3.1+ entegrasyon testlerini canlı Postgres karşı koşturmak,
# prod/staging stack'lerine dokunmadan. Production runtime image'ı yeniden
# kullanılır; pytest deps runtime'da pip ile kurulur (Dockerfile'a "test"
# stage eklemek yerine — minimal cerrahi). CI çıkana kadar (Sprint 8.4)
# geçici çözüm.
#
# Komut:
#   sudo docker compose -f /opt/imga/infra/imga/test/docker-compose.yml \
#     up --build --abort-on-container-exit --exit-code-from api-test
#
# api-test container'ı pytest exit code'u ile sonlanır → compose o code'la
# döner → CI/script entegrasyonu kolay. Volume yok, port expose yok,
# init script konteynır ile başlar → tek shot, sıfır kalıcı durum.

name: imga-test

services:
  postgres-test:
    image: pgvector/pgvector:pg17
    container_name: imga-test-postgres
    # Test conftest'i hard-coded parolaları bekler (imga_dev_password /
    # imga_app_password / imga_admin_password). Init script POSTGRES_USER
    # rolünü POSTGRES_PASSWORD'le, app + admin'i IMGA_*_PASSWORD env'leri
    # boşsa default'larla yaratır — burada POSTGRES_PASSWORD'ü conftest'in
    # owner default'una eşitliyoruz, app/admin için env vermiyoruz ki
    # default'lar devreye girsin.
    environment:
      POSTGRES_USER: imga_owner
      POSTGRES_PASSWORD: imga_dev_password
      POSTGRES_DB: imga
    volumes:
      - ../../../packages/imga-db/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - imga-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imga_owner -d imga"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Sprint 8.3.6 — SWOT generator + multi-key rotation cache. Test
  # stack mirrors production's redis service so the cache hooks fire
  # during pytest. allkeys-lru with a tiny maxmemory keeps the
  # container small for short-lived test runs.
  redis-test:
    image: redis:7-alpine
    container_name: imga-test-redis
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    networks:
      - imga-test-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  api-test:
    # Production image'ını yeniden kullanırız — pytest + plugin'leri
    # runtime'da kurulur. Image build edilmemişse :latest tag'inden
    # düşer, build context production ile aynı.
    image: imga-api:test
    build:
      context: ../../..
      dockerfile: packages/imga-api/Dockerfile
    container_name: imga-test-api
    networks:
      - imga-test-net
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    # Sprint 8.3.6 — Fernet master key mount for tenant LLM credential
    # encryption tests. Source is repo-local infra/imga/test/secrets/
    # (gitignored, generated via scripts/generate_master_key.py before
    # the first run; CI hook regenerates per build).
    secrets:
      - source: imga_master_key
        target: imga/master.key
        mode: 0400
    environment:
      # Conftest bu iki var'ı okur; defaultlar (localhost:5433) yerine
      # docker network'teki postgres-test:5432'yi gösterir.
      IMGA_TEST_PG_HOST: postgres-test
      IMGA_POSTGRES_PORT: "5432"
      # E2E tests bunu okur (e2e_env fixture override etse de güvenlik
      # ağı). Test-only secret, gerçek bir şey değil.
      JWT_SECRET_KEY: test-secret-key-32-bytes-min-padding-xyz
      # Sprint 8.3.6 — encryption helper + Redis URL.
      IMGA_MASTER_KEY_PATH: /run/secrets/imga/master.key
      REDIS_URL: redis://redis-test:6379/0
      # Alembic migration'ları test postgres'e koşturmak için (E2E
      # fixture create_engine("admin") etkisini kullanır; tablolar
      # önce alembic upgrade head ile yaratılmalı — entrypoint command
      # bunu yapar).
      DATABASE_URL_OWNER: postgresql+asyncpg://imga_owner:imga_dev_password@postgres-test:5432/imga
      DATABASE_URL: postgresql+asyncpg://imga_app:imga_app_password@postgres-test:5432/imga
      DATABASE_URL_ADMIN: postgresql+asyncpg://imga_admin:imga_admin_password@postgres-test:5432/imga
    # Pytest deps pip install için root gerekir (runtime image USER imga,
    # site-packages owner root). Test'ler tmp_path'e yazar, root sorun değil.
    user: root
    # Tests + pyproject ro mount; src değil — production'a giden code
    # path'i test edilir, lokal değişiklik testleri etkilemez.
    # Sprint 8.3.6.2 — imga-core/tests/ ek olarak mount: rotator + SWOT/
    # OKR provider unit testleri orada yaşıyor (pure async, ne SDK ne
    # DB), test compose'un toplam pass count'una dahil edilmeli.
    volumes:
      - ../../../packages/imga-api/tests:/app/tests:ro
      - ../../../packages/imga-api/pyproject.toml:/app/pyproject.toml:ro
      - ../../../packages/imga-core/tests:/app/tests-core:ro
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        echo "[test-stack] installing pytest deps"
        pip install --no-cache-dir --quiet \
          pytest pytest-asyncio pytest-timeout pytest-cov \
          factory-boy httpx fakeredis
        echo "[test-stack] migrating test postgres to head"
        alembic upgrade head
        echo "[test-stack] running pytest"
        python -m pytest \
          tests/test_batch_upload.py \
          tests/test_batch_dedup.py \
          tests/test_batch_concurrency.py \
          tests/test_reviews_list.py \
          tests/test_orphan_recovery.py \
          tests/test_review_manual_ticket.py \
          tests/test_report_generation.py \
          tests/test_analytics.py \
          tests/test_nps_detector.py \
          tests/test_batch_nps.py \
          tests/test_tenant_analyze_nps.py \
          tests/test_analytics_nps.py \
          tests/test_analytics_headline.py \
          tests/test_company_taxonomy.py \
          tests/test_company_perspective_wire_in.py \
          tests/test_encryption_smoke.py \
          tests/test_stats_aggregator.py \
          tests/test_swot_service.py \
          tests/test_i18n_language_directive.py \
          tests/test_okr_service.py \
          tests/test_strategic_reports_routes.py \
          tests/test_llm_credentials_routes.py \
          tests/test_tenant_profile_routes.py \
          tests/test_pdf_render.py \
          tests/test_tenant_taxonomies_crud.py \
          tests/test_sla_engine.py \
          tests/test_tenant_sla_rules_routes.py \
          tests/test_smart_parser.py \
          tests/test_word_cloud_generator.py \
          tests/test_insights_routes.py \
          tests/test_action_items_routes.py \
          tests/test_trend_alerts_routes.py \
          tests/test_webhook_dispatcher.py \
          tests/test_gemini_response_parser.py \
          tests/test_briefing_kpi_compute.py \
          tests/test_sprint_9_0_5_b_foundation.py \
          tests/test_batch_freeze_regression.py \
          tests/test_batch_parallel_dispatch.py \
          tests/test_batch_sse.py \
          tests/test_auth.py \
          tests/test_query_counts.py \
          tests/test_10k_benchmark.py \
          tests/test_kpi_goal_progress.py \
          tests/test_briefing_schedule_next_run.py \
          tests/test_prompt_resolver_render.py \
          tests/test_llm_audit_classifier.py \
          tests/test_schedule_period_mapper.py \
          tests/test_kpi_goal_period_aware_resolution.py \
          tests/test_snapshot_period_window.py \
          tests/test_file_parser_dimensions.py \
          tests/test_llm_audit_savepoint_isolation.py \
          tests/test_llm_audit_orm_insert.py \
          tests/test_llm_audit_summary_endpoint.py \
          tests/test_run_schedule_now_failure_path.py \
          tests/test_analyze_audit_integration.py \
          tests/test_briefing_audit_failure_path.py \
          tests/test_auth_user_cache.py \
          tests/test_worker_healthcheck.py \
          tests/test_action_items_idempotency.py \
          tests/test_reviews_list_heatmap_drilldown.py \
          tests/test_admin_invitations.py \
          tests/test_default_model_name_constants.py \
          tests/test_batch_audit_token_capture.py \
          tests/test_swot_audit_path.py \
          tests/test_okr_audit_path.py \
          tests/test_trial_analyze.py \
          tests/test_batch_template.py \
          tests/test_executive_overview.py \
          tests/test_review_corrections.py \
          tests/test_upload_validation.py \
          tests/test_api_token_security.py \
          tests/test_api_tokens_service.py \
          tests/test_admin_session_regression.py \
          tests/test_sse_streaming.py \
          tests/contract/test_error_envelope.py \
          tests/contract/test_response_envelope.py \
          tests-core/test_key_rotation.py \
          tests-core/test_unified_classifier.py \
          tests-core/test_metrics_pure_formulas.py \
          tests-core/test_gemini_swot_okr.py \
          tests-core/test_bert_thread_safety.py \
          tests-core/test_hybrid_parallel_batch.py \
          tests-core/test_rotating_gemini_provider.py \
          tests-core/test_rotating_gemini_async_loop.py \
          tests-core/test_hybrid_key_telemetry.py \
          tests-core/test_r7_timeout_and_cancel.py \
          tests-core/test_gemini_sdk_timeout_actually_applied.py \
          tests-core/test_gemini_stream_text.py \
          -v --tb=short

  # Sprint 9.0.6 E — frontend TS typecheck guard. Builds the
  # ``typecheck`` stage of packages/imga-web/Dockerfile, which runs
  # ``npm run typecheck`` (tsc --noEmit) and exits non-zero on the
  # first TS error. We keep it separate from api-test so a Python-only
  # change still runs the full suite without paying the npm install
  # cost — invoke explicitly with ``--profile typecheck`` or build the
  # service by name.
  web-typecheck:
    profiles:
      - typecheck
    image: imga-web:typecheck
    build:
      context: ../../../packages/imga-web
      dockerfile: Dockerfile
      target: typecheck
    container_name: imga-test-web-typecheck
    # The build step IS the test — if it succeeds there's nothing for
    # the container to do. ``true`` exits 0 so compose --abort-on-
    # container-exit doesn't treat a successful build as a failure.
    command: ["true"]

networks:
  imga-test-net:
    name: imga-test-net

# Sprint 8.3.6 — repo-local test master key. Generate once via
# `python scripts/generate_master_key.py infra/imga/test/secrets/master.key`
# before running the test stack. Gitignored; regenerating invalidates
# any encrypted ciphertext stored in the test postgres volume (also
# ephemeral, so re-runs survive).
secrets:
  imga_master_key:
    file: ./secrets/master.key
