# İmga.AI — staging stack
#
# Yer: /opt/imga/infra/imga/staging/docker-compose.yml (sunucuda)
#
# Production stack'in aynısı, ama:
#   * Container isimleri imga-staging-* prefix'i
#   * Postgres kendi ayrı volume'unda (imga-staging-postgres-data)
#   * Internal network ayrı (imga-staging-internal)
#   * NEXT_PUBLIC_API_URL=https://api-staging.imga.ai (build arg)
#   * Caddy config staging.imga.ai + api-staging.imga.ai'a yönlendirir
#
# Komut: cd /opt/imga/infra/imga/staging && sudo docker compose up -d

name: imga-staging

services:
  postgres:
    image: postgres:17-alpine
    container_name: imga-staging-postgres
    restart: unless-stopped
    env_file: /etc/imga/staging/postgres.env
    environment:
      POSTGRES_DB: imga
      POSTGRES_USER: imga_owner
    # Sprint 9.0 — same shape as production tuning, scaled to the 1G
    # ceiling. Staging traffic is light so 25% shared_buffers (256MB)
    # is plenty; pg_stat_statements still loaded so migration 0022 and
    # the slow-query review behave identically across environments.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
      - -c
      - pg_stat_statements.max=2000
      - -c
      - pg_stat_statements.track=all
      - -c
      - random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../../packages/imga-db/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - imga-staging-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imga_owner -d imga"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          # Staging trafiği düşük; production'ın çeyreği yeterli.
          memory: 1G
          cpus: '1'

  api:
    image: imga-api:staging
    build:
      context: ../../..
      dockerfile: packages/imga-api/Dockerfile
    container_name: imga-staging-api
    restart: unless-stopped
    env_file: /etc/imga/staging/api.env
    # Sprint 8.3.6 — same encryption + Redis wiring as production.
    # Staging shares the master key file path on the host but the
    # mounted source is staging-specific (see top-level secrets).
    environment:
      IMGA_MASTER_KEY_PATH: /run/secrets/imga/master.key
      REDIS_URL: redis://redis:6379/0
    secrets:
      - source: imga_master_key
        target: imga/master.key
        mode: 0400
    networks:
      - imga-staging-internal
      - caddy-public
    # Sprint 8.3.1: batch upload payload'ları host'ta. Staging için
    # ayrı /var/imga-staging/uploads — production ile karışmasın.
    # Sprint 8.3.2: rapor çıktıları /var/imga-staging/reports'a, aynı izolasyon.
    # Container içinde default path'ler görünür (settings default değişmez).
    # Host dizinleri owner=1000:1000 (Dockerfile'daki imga user).
    volumes:
      - /var/imga-staging/uploads:/var/imga/uploads
      - /var/imga-staging/reports:/var/imga/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 — production compose ile aynı sebep (Alpine localhost
      # ::1 + BusyBox wget IPv6-only fallback yok). Detay için
      # production/docker-compose.yml api healthcheck yorumuna bak.
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          # BERT modelinin RAM'i tek kopya kalsın diye production ile
          # aynı; ikisi paralel ayakta kalsa toplam ~6 GB RAM tüketir.
          memory: 2G
          cpus: '2'

  # Sprint 9.0.5-A — same arq worker as production, scaled for
  # staging traffic. Smaller pipeline pool (2 instead of 4) so the
  # combined api + api-worker memory footprint fits the staging VPS
  # budget. See production compose for the freeze-fix rationale.
  api-worker:
    image: imga-api:staging
    build:
      context: ../../..
      dockerfile: packages/imga-api/Dockerfile
    container_name: imga-staging-api-worker
    restart: unless-stopped
    env_file: /etc/imga/staging/api.env
    environment:
      IMGA_MASTER_KEY_PATH: /run/secrets/imga/master.key
      REDIS_URL: redis://redis:6379/0
      IMGA_BATCH_CHUNK_CONCURRENCY: "2"
    secrets:
      - source: imga_master_key
        target: imga/master.key
        mode: 0400
    networks:
      - imga-staging-internal
    volumes:
      - /var/imga-staging/uploads:/var/imga/uploads
      - /var/imga-staging/reports:/var/imga/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - python
      - -m
      - arq
      - imga_api.workers.arq_worker.WorkerSettings
    deploy:
      resources:
        limits:
          # Sprint 9.0.5-A R3 — production-mirror after staging
          # itself caught the OOM (1G + 2-pipeline pool peaked
          # ~1.3 GiB once the R2 eager-import cache landed).
          # Keeping concurrency at 2 here — 4 GiB ceiling matches
          # production so a memory regression that reaches staging
          # behaves identically before it can hit prod. See
          # production/docker-compose.yml for the OOM rationale.
          memory: 4G
          cpus: '1'

  web:
    image: imga-web:staging
    build:
      context: ../../../packages/imga-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api-staging.imga.ai
    container_name: imga-staging-web
    restart: unless-stopped
    networks:
      - caddy-public
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

  # Sprint 8.3.6 — staging Redis. Smaller maxmemory than production
  # since SWOT load is lower; same eviction policy.
  redis:
    image: redis:7-alpine
    container_name: imga-staging-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - imga-staging-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.25'

networks:
  imga-staging-internal:
    name: imga-staging-internal
  caddy-public:
    external: true

volumes:
  postgres_data:
    name: imga-staging-postgres-data
  redis_data:
    name: imga-staging-redis-data

# Sprint 8.3.6 — Fernet master key for tenant LLM credential encryption.
# Staging-specific source file on the host. See production compose for
# the equivalent.
secrets:
  imga_master_key:
    file: /etc/imga-secrets/master.key
