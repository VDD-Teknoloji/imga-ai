# İmga.AI — staging Caddy config
#
# Yer: /opt/shared/caddy/conf.d/imga-staging.conf (sunucuda)
#
# Production ile aynı şekil ama:
#   * Subdomain'ler staging.imga.ai + api-staging.imga.ai
#   * Container hostname'leri imga-staging-* (staging compose stack)
#   * X-Robots-Tag: noindex (search engine'ler staging'i indekslemesin)

staging.imga.ai {
    encode gzip
    reverse_proxy imga-staging-web:3000

    header {
        Strict-Transport-Security "max-age=31536000"
        X-Content-Type-Options    "nosniff"
        X-Frame-Options           "DENY"
        Referrer-Policy           "strict-origin-when-cross-origin"
        # Staging environment'ı arama motorları görmesin — veri test
        # verisi olabilir, KVKK riski.
        X-Robots-Tag              "noindex, nofollow"
        -Server
        -X-Powered-By
    }

    handle /caddy-health {
        respond "ok" 200
    }
}

api-staging.imga.ai {
    encode gzip
    reverse_proxy imga-staging-api:8000

    header {
        Strict-Transport-Security "max-age=31536000"
        X-Robots-Tag              "noindex, nofollow"
        -Server
        -X-Powered-By
    }
}
