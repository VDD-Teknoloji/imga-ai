# İmga.AI — production Caddy config
#
# Yer: /opt/shared/caddy/conf.d/imga-production.conf (sunucuda)
#
# Bu dosya repodan kopyalanır:
#   cp /opt/imga/infra/imga/caddy/imga-production.conf \
#      /opt/shared/caddy/conf.d/imga-production.conf
#   docker exec caddy caddy reload --config /etc/caddy/Caddyfile
#
# Caddy auto-TLS (Let's Encrypt) sertifikayı otomatik alır. İlk
# alımdan önce DNS'in VPS IP'ye doğru resolve ettiğinden emin ol —
# Cloudflare'de A kayıtları "DNS only" (gri bulut) olabilir veya
# "Proxied" (turuncu bulut) — proxied seçildiğinde Cloudflare SSL/TLS
# modunun "Full (strict)" olması zorunlu, aksi takdirde sonsuz
# yönlendirme döngüsü oluşur.

# Frontend — Next.js standalone server
app.imga.ai {
    encode gzip
    reverse_proxy imga-prod-web:3000

    # Güvenlik header'ları. HSTS yalnızca cert kararlı çalıştığından
    # emin olduktan sonra aç (cert yenileme sorunu varsa preload'a
    # düşmeden önce çözmek gerekir, max-age büyük tutmadan önce
    # birkaç hafta gözle).
    header {
        Strict-Transport-Security "max-age=31536000"
        X-Content-Type-Options    "nosniff"
        X-Frame-Options           "DENY"
        Referrer-Policy           "strict-origin-when-cross-origin"
        # Caddy'nin kendi bilgisini X-Powered-By ile sızdırmasın
        -Server
        -X-Powered-By
    }

    # /health endpoint'i — uptime probe'u Caddy seviyesinde de
    # cevaplansın, web container'ı down ise bile
    # "Caddy ayakta, web yok" net olsun.
    handle /caddy-health {
        respond "ok" 200
    }
}

# Backend API — FastAPI
api.imga.ai {
    encode gzip
    reverse_proxy imga-prod-api:8000

    header {
        Strict-Transport-Security "max-age=31536000"
        -Server
        -X-Powered-By
    }

    # /health backend endpoint'i (FastAPI tarafında zaten var); ayrı
    # bir Caddy-level health'a ihtiyaç yok.
}
