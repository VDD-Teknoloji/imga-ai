# Local + production stack for the imga project.
# - core-tests: builds packages/imga-core and runs pytest on demand
# - legacy-ui:  the Streamlit prototype, exposed on the host
#
# Usage:
#   docker compose up legacy-ui              # run the UI only
#   docker compose run --rm core-tests       # one-shot test run
#   docker compose --profile slow run core-tests-slow   # BERT snapshot tests
#
# Copy .env.example to .env to override defaults (host port, data path, etc.)

name: imga

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: imga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: imga
      POSTGRES_USER: imga_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imga_dev_password}
      IMGA_APP_PASSWORD: ${IMGA_APP_PASSWORD:-imga_app_password}
      IMGA_ADMIN_PASSWORD: ${IMGA_ADMIN_PASSWORD:-imga_admin_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/imga-db/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "${IMGA_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imga_owner -d imga"]
      interval: 5s
      timeout: 3s
      retries: 5

  core-tests:
    image: imga-core:dev
    build:
      context: ./packages/imga-core
      dockerfile: Dockerfile
    profiles: ["test"]
    command: ["python", "-m", "pytest", "tests/", "-v"]
    volumes:
      - hf_cache:/cache/huggingface

  core-tests-slow:
    image: imga-core:dev
    build:
      context: ./packages/imga-core
      dockerfile: Dockerfile
    profiles: ["slow"]
    environment:
      IMGA_RUN_SLOW: "1"
    command: ["python", "-m", "pytest", "tests/", "-v", "-m", "slow"]
    volumes:
      - hf_cache:/cache/huggingface

  api:
    image: imga-api:latest
    build:
      context: .
      dockerfile: ./packages/imga-api/Dockerfile
      # imga-api ships a ``smoke-runtime`` stage AFTER ``runtime`` (pytest
      # CMD, no HTTP server) — without an explicit target, `compose build`
      # takes the LAST stage. Pinned here (and on api-worker below) both
      # because api itself needs the uvicorn CMD and because the two
      # services share the ``imga-api:latest`` tag: if their targets ever
      # diverged, whichever service built last would silently overwrite
      # the other's image content.
      target: runtime
    container_name: imga-api
    restart: unless-stopped
    ports:
      - "${IMGA_API_PORT:-8000}:8000"
    volumes:
      - hf_cache:/cache/huggingface
      - ${IMGA_DATA_PATH:-./data}:/data
      # Shared with api-worker — the API writes batch upload payloads +
      # report output here, the worker reads them back (see api-worker's
      # comment below).
      - uploads_data:/var/imga/uploads
      - reports_data:/var/imga/reports
    environment:
      IMGA_KB_PATH: /data/training_data.csv
      IMGA_RULES_PATH: /data/cx_rules.json
      # Sprint 6 — category classification LLM fallback (off by default)
      IMGA_LLM_FALLBACK_ENABLED: "${IMGA_LLM_FALLBACK_ENABLED:-false}"
      IMGA_LLM_PROVIDER: "${IMGA_LLM_PROVIDER:-gemini}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      IMGA_GEMINI_MODEL: "${IMGA_GEMINI_MODEL:-gemini-2.5-flash}"
      # main.py reads this to switch batch dispatch onto the arq queue
      # (api-worker below) instead of the in-process APScheduler path —
      # unset, root-cause auto-generation after upload never fires
      # locally because app.state.arq_pool stays None.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # Sprint 9.0.5-A mirror (see infra/imga/production/docker-compose.yml)
  # — out-of-process batch worker (arq). Local dev had no redis/worker
  # at all, so REDIS_URL was always unset and app.state.arq_pool stayed
  # None: batch jobs ran in-process (still worked) but root-cause
  # auto-generation, which is dispatched onto the arq queue after a
  # successful upload, silently never fired. Same image as api, CMD
  # swapped to the arq entrypoint.
  api-worker:
    image: imga-api:latest
    build:
      context: .
      dockerfile: ./packages/imga-api/Dockerfile
      target: runtime
    container_name: imga-api-worker
    restart: unless-stopped
    volumes:
      - hf_cache:/cache/huggingface
      - ${IMGA_DATA_PATH:-./data}:/data
      - uploads_data:/var/imga/uploads
      - reports_data:/var/imga/reports
    environment:
      IMGA_KB_PATH: /data/training_data.csv
      IMGA_RULES_PATH: /data/cx_rules.json
      IMGA_LLM_FALLBACK_ENABLED: "${IMGA_LLM_FALLBACK_ENABLED:-false}"
      IMGA_LLM_PROVIDER: "${IMGA_LLM_PROVIDER:-gemini}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      IMGA_GEMINI_MODEL: "${IMGA_GEMINI_MODEL:-gemini-2.5-flash}"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "arq", "imga_api.workers.arq_worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "python", "-m", "imga_api.workers.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Sprint 8.3.6 cache + Sprint 9.0.5-A arq queue backend, mirrored from
  # the production stack so the worker above has something to enqueue
  # onto locally.
  redis:
    image: redis:7-alpine
    container_name: imga-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      # 127.0.0.1 explicit — same IPv6/BusyBox reasoning as the web/api
      # healthchecks above (see CLAUDE.md); redis-cli defaults to
      # 127.0.0.1 too, but this keeps the intent visible.
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    image: imga-dashboard:latest
    build:
      context: .
      dockerfile: ./packages/imga-dashboard/Dockerfile
    container_name: imga-dashboard
    restart: unless-stopped
    ports:
      - "${IMGA_DASHBOARD_PORT:-8502}:8501"
    volumes:
      - hf_cache:/cache/huggingface
      - ${IMGA_DATA_PATH:-./data}:/data
    environment:
      IMGA_DATA_PATH: /data
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_HEADLESS: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  web:
    image: imga-web:latest
    build:
      context: ./packages/imga-web
      dockerfile: Dockerfile
    container_name: imga-web
    restart: unless-stopped
    ports:
      - "${IMGA_WEB_PORT:-3000}:3000"
    environment:
      # Public URL the browser uses to talk to the API. Inside the
      # docker network the api hostname resolves to the api service;
      # for direct host browsing you'll override this in .env to
      # http://localhost:${IMGA_API_PORT:-8000}.
      NEXT_PUBLIC_API_URL: ${IMGA_WEB_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  legacy-ui:
    image: imga-legacy:latest
    build:
      context: ./legacy
      dockerfile: Dockerfile
    container_name: imga-legacy-ui
    profiles: ["legacy"]
    restart: unless-stopped
    ports:
      - "${IMGA_LEGACY_PORT:-8501}:8501"
    volumes:
      - hf_cache:/cache/huggingface
      - ${IMGA_DATA_PATH:-./data}:/data
    working_dir: /data
    command: ["streamlit", "run", "/app/app.py"]
    environment:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_HEADLESS: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  hf_cache:
    name: imga_hf_cache
  postgres_data:
    name: imga_postgres_data
  redis_data:
    name: imga_redis_data
  # Batch upload payloads + report output, shared between api and
  # api-worker (see api-worker's comment above).
  uploads_data:
    name: imga_uploads_data
  reports_data:
    name: imga_reports_data
