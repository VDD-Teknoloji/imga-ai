name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff>=0.6
      - name: Ruff check (all packages)
        run: |
          set -e
          for pkg in imga-core imga-api imga-dashboard; do
            echo "::group::ruff check $pkg"
            ruff check packages/$pkg/src packages/$pkg/tests --config packages/$pkg/pyproject.toml
            echo "::endgroup::"
          done
      - name: Ruff format check
        run: ruff format --check packages/

  typecheck:
    name: Mypy strict
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [imga-core, imga-api, imga-dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        working-directory: packages/${{ matrix.package }}
        run: |
          # imga-core is a dependency of api and dashboard.
          if [ "${{ matrix.package }}" != "imga-core" ]; then
            pip install -e ../imga-core
          fi
          pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch>=2.0,<3.0"
          pip install -e ".[dev]"
      - name: Mypy
        working-directory: packages/${{ matrix.package }}
        run: python -m mypy src

  test:
    name: Pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [imga-core, imga-api, imga-dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        working-directory: packages/${{ matrix.package }}
        run: |
          if [ "${{ matrix.package }}" != "imga-core" ]; then
            pip install -e ../imga-core
          fi
          pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch>=2.0,<3.0"
          pip install -e ".[dev]"
      - name: Run tests
        working-directory: packages/${{ matrix.package }}
        run: python -m pytest tests/ -v --cov=src --cov-report=xml
      - name: Upload coverage
        if: matrix.package == 'imga-core'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage.xml
          retention-days: 7

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build core-tests image
        uses: docker/build-push-action@v6
        with:
          context: ./packages/imga-core
          file: ./packages/imga-core/Dockerfile
          push: false
          load: true
          tags: imga-core:ci
          cache-from: type=gha,scope=imga-core
          cache-to: type=gha,mode=max,scope=imga-core
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/imga-api/Dockerfile
          push: false
          load: true
          tags: imga-api:ci
          cache-from: type=gha,scope=imga-api
          cache-to: type=gha,mode=max,scope=imga-api
      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/imga-dashboard/Dockerfile
          push: false
          load: true
          tags: imga-dashboard:ci
          cache-from: type=gha,scope=imga-dashboard
          cache-to: type=gha,mode=max,scope=imga-dashboard
      - name: Smoke-test core image
        run: docker run --rm imga-core:ci python -m pytest tests/
